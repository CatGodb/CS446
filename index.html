<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Machine-111 | Server Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #6e7987; /* พื้นหลังเทาเข้มแบบในภาพตัวอย่าง */
            font-family: 'Plus Jakarta Sans', sans-serif;
            padding: 20px;
        }

        /* Business Card Container */
        .card {
            width: 100%;
            max-width: 680px;
            height: 380px;
            background-color: #f3f4f6;
            border-radius: 28px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
            display: flex;
            position: relative;
            overflow: hidden;
        }

        /* Left Navy Blue Section */
        .left-section {
            width: 52%;
            background-color: #11284a; /* กรมท่าเข้ม */
            color: #ffffff;
            border-top-right-radius: 0;
            border-bottom-right-radius: 24px;
            border-bottom-left-radius: 24px;
            margin-left: 28px;
            margin-bottom: 24px;
            padding: 40px 30px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            box-shadow: 4px 6px 15px rgba(0, 0, 0, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        /* เส้นกรอบโค้งด้านในฝั่งซ้าย */
        .left-section::before {
            content: '';
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            bottom: 10px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-bottom-right-radius: 18px;
            border-bottom-left-radius: 18px;
            pointer-events: none;
        }

        .user-info h1 {
            font-family: 'Cinzel', serif;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            color: #ffffff;
        }

        .divider-line {
            width: 45px;
            height: 2.5px;
            background-color: #3b82f6;
            border-radius: 2px;
            margin-bottom: 10px;
            position: relative;
        }

        .divider-line::after {
            content: '';
            position: absolute;
            right: -15px;
            top: 0;
            width: 8px;
            height: 2.5px;
            background-color: #94a3b8;
            border-radius: 2px;
        }

        .user-info p {
            font-size: 13px;
            color: #94a3b8;
            font-weight: 500;
            text-transform: capitalize;
            letter-spacing: 0.3px;
        }

        /* Branding Logo Area */
        .brand-area {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: auto;
        }

        .brand-logo {
            font-size: 32px;
            color: #ffffff;
            margin-bottom: 4px;
            letter-spacing: 2px;
        }

        .brand-name {
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 2px;
            color: #ffffff;
        }

        .brand-sub {
            font-size: 9px;
            color: #94a3b8;
            letter-spacing: 0.5px;
            margin-top: 2px;
        }

        /* Right Content Section */
        .right-section {
            width: 48%;
            padding: 40px 30px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 18px;
        }

        .info-row {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .icon-box {
            width: 38px;
            height: 38px;
            background-color: #11284a;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            font-size: 14px;
            flex-shrink: 0;
            box-shadow: 0 4px 8px rgba(17, 40, 74, 0.2);
        }

        .info-text {
            display: flex;
            flex-direction: column;
        }

        .info-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #64748b;
            font-weight: 700;
        }

        .info-val {
            font-size: 14px;
            color: #1e293b;
            font-weight: 600;
        }

        /* Server Status Pill */
        .status-container {
            margin-top: 5px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 11px;
            font-weight: 600;
            color: #475569;
            background-color: #e2e8f0;
            padding: 6px 12px;
            border-radius: 20px;
            width: fit-content;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #22c55e;
            border-radius: 50%;
            box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.2);
        }

        /* Responsive Design */
        @media (max-width: 600px) {
            .card {
                height: auto;
                flex-direction: column;
                border-radius: 20px;
            }
            .left-section {
                width: calc(100% - 40px);
                margin: 20px auto 0 auto;
                border-radius: 16px;
                padding: 30px 20px;
            }
            .left-section::before {
                border-radius: 12px;
            }
            .right-section {
                width: 100%;
                padding: 25px 30px 35px 30px;
            }
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="left-section">
            <div class="user-info">
                <h1>Benya Pengkhuean</h1>
                <div class="divider-line"></div>
            </div>

            <div class="brand-area">
                <i class="fa-solid fa-cube brand-logo"></i>
                <div class="brand-name">SERVER PORTAL</div>
                <div class="brand-sub">Secure Cloud Infrastructure</div>
            </div>
        </div>

        <div class="right-section">
            <div class="info-row">
                <div class="icon-box">
                    <i class="fa-solid fa-server"></i>
                </div>
                <div class="info-text">
                    <span class="info-label">Machine name</span>
                    <span class="info-val">1660701341</span>
                </div>
            </div>

            <div class="info-row">
                <div class="icon-box">
                    <i class="fa-solid fa-id-card"></i>
                </div>
                <div class="info-text">
                    <span class="info-label">Student ID</span>
                    <span class="info-val">1660701341</span>
                </div>
            </div>

            <div class="info-row">
                <div class="icon-box">
                    <i class="fa-solid fa-network-wired"></i>
                </div>
                <div class="info-text">
                    <span class="info-label">Host IP</span>
                    <span class="info-val">3.208.2.15</span>
                </div>
            </div>

            <div class="status-container">
                <span class="status-dot"></span>
                <span>System Online • Ubuntu 24.04 LTS</span>
            </div>
        </div>
    </div>

</body>
</html>
